<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Pedidos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="pagina-pedidos">

<header class="mini-hero">
    <a href="index.html" class="mini-hero-marca">
        <img src="Imagenes/logo-carton-pintado.jpeg" alt="Logo Cartón Pintado" class="mini-hero-logo">
        <span>Cartón Pintado</span>
    </a>
</header>

<div class="card card-lista">
    <h1>Ver Pedidos</h1>
    <h2>Pedidos de los clientes</h2>
    <p>Aqui se muestran los pedidos que dejaron los clientes registrados.</p>

    <div id="listaPedidos" class="pedidos"></div>

    <p id="vacio" class="mensaje" style="display:none;">No hay pedidos todavia.</p>

    <a href="index.html" class="btn btn-volver">Volver al inicio</a>
</div>

<div id="modalDetalle" class="modal-overlay">
    <div class="modal-contenido">
        <button type="button" id="cerrarDetalle" class="btn-cerrar" title="Cerrar">&times;</button>
        <div id="contenidoDetalle" class="detalle"></div>
        <div class="modal-acciones" id="accionesDetalle" style="display:none;">
            <button type="button" id="btnEntregadoModal" class="btn-accion btn-editar btn-grande">Entregado</button>
            <button type="button" id="btnCanceladoModal" class="btn-accion btn-eliminar btn-grande">Cancelar</button>
        </div>
    </div>
</div>

<script type="module">
    import { db, collection, getDocs, query, orderBy, updateDoc, doc, serverTimestamp, obtenerEsAdmin } from './firebaseConfig.js';
    import { enviarAvisoPedido } from './emailPedido.js';

    obtenerEsAdmin().then(function (admin) {
        if (!admin) {
            location.href = 'index.html';
            return;
        }
        cargarPedidos();
    });

    function formatearFecha(fecha) {
        if (!fecha) return '-';
        if (typeof fecha.toDate === 'function') {
            return fecha.toDate().toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' });
        }
        return String(fecha);
    }

    function formatearPrecio(precio) {
        const numero = Number(precio);
        if (!Number.isFinite(numero)) return '$' + precio;
        return numero.toLocaleString('es-AR', { style: 'currency', currency: 'ARS', minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }

    const ETIQUETAS_ESTADO = {
        pendiente: 'Pendiente',
        listo_para_despacho: 'Listo para despacho',
        entregado: 'Entregado',
        cancelado: 'Cancelado'
    };

    function etiquetaEstado(estado) {
        const clave = estado || 'pendiente';
        return ETIQUETAS_ESTADO[clave] || clave;
    }

    function cargarPedidos() {
        cargarProductosParaImagenes()
            .then(function () {
                return getDocs(query(collection(db, 'pedidos'), orderBy('fecha', 'desc')));
            })
            .then(function (snapshot) {
                const contenedor = document.getElementById('listaPedidos');
                const vacio = document.getElementById('vacio');
                contenedor.innerHTML = '';

                if (snapshot.empty) {
                    vacio.style.display = 'block';
                    return;
                }

                vacio.style.display = 'none';
                snapshot.forEach(function (docSnap) {
                    contenedor.appendChild(crearPedido(docSnap.id, docSnap.data()));
                });
            })
            .catch(function (error) {
                document.getElementById('vacio').textContent = 'No se pudieron cargar los pedidos: ' + error.message;
                document.getElementById('vacio').style.display = 'block';
            });
    }

    function crearPedido(id, p) {
        const items = (Array.isArray(p.items) && p.items.length > 0)
            ? p.items
            : [{
                productoId: p.productoId,
                productoNombre: p.productoNombre,
                productoPrecio: p.productoPrecio,
                cantidad: p.cantidad || 1
            }];

        const total = Number.isFinite(Number(p.total))
            ? Number(p.total)
            : items.reduce(function (t, i) { return t + Number(i.productoPrecio) * Number(i.cantidad); }, 0);

        const pedido = document.createElement('div');
        pedido.className = 'pedido';

        const info = document.createElement('div');
        info.className = 'pedido-info';

        items.forEach(function (item) {
            const fila = document.createElement('div');
            fila.className = 'pedido-fila';

            const mini = document.createElement('div');
            mini.className = 'pedido-mini';
            const producto = (mapaProductos || {})[item.productoId] || {};
            const src = producto.imagen || item.imagen;
            if (src) {
                const img = document.createElement('img');
                img.src = src;
                img.alt = item.productoNombre || 'Carta';
                img.loading = 'lazy';
                mini.appendChild(img);
            } else {
                const span = document.createElement('span');
                span.textContent = 'MTG';
                mini.appendChild(span);
            }

            const infoFila = document.createElement('div');
            infoFila.className = 'pedido-fila-info';

            const linea = document.createElement('div');
            linea.className = 'pedido-nombre';
            linea.textContent = item.productoNombre + '  x' + item.cantidad;

            const sub = document.createElement('div');
            sub.className = 'pedido-fecha';
            sub.textContent = formatearPrecio(Number(item.productoPrecio)) + ' c/u = ' + formatearPrecio(Number(item.productoPrecio) * Number(item.cantidad));

            infoFila.appendChild(linea);
            infoFila.appendChild(sub);

            fila.appendChild(mini);
            fila.appendChild(infoFila);

            info.appendChild(fila);
        });

        const cliente = document.createElement('div');
        cliente.className = 'pedido-cliente';
        cliente.textContent = p.usuarioEmail || 'Cliente';

        const fecha = document.createElement('div');
        fecha.className = 'pedido-fecha';
        fecha.textContent = formatearFecha(p.fecha);

        const precio = document.createElement('div');
        precio.className = 'pedido-precio';
        precio.textContent = 'Total: ' + formatearPrecio(total);

        info.appendChild(cliente);
        info.appendChild(fecha);
        info.appendChild(precio);

        const estado = document.createElement('div');
        estado.className = 'pedido-estado estado-' + (p.estado || 'pendiente');
        estado.textContent = etiquetaEstado(p.estado);

        const acciones = document.createElement('div');
        acciones.className = 'pedido-acciones';

        const btnDetalle = document.createElement('button');
        btnDetalle.type = 'button';
        btnDetalle.className = 'btn-accion btn-pedir';
        btnDetalle.textContent = 'Ver detalle';
        btnDetalle.onclick = function () {
            abrirDetalle(id, p);
        };

        acciones.appendChild(btnDetalle);

        const btnEntregado = document.createElement('button');
        btnEntregado.type = 'button';
        btnEntregado.className = 'btn-accion btn-editar';
        btnEntregado.textContent = 'Entregado';
        btnEntregado.disabled = p.estado === 'entregado';
        btnEntregado.onclick = function () {
            actualizarEstado(id, 'entregado', p);
        };

        const btnCancelado = document.createElement('button');
        btnCancelado.type = 'button';
        btnCancelado.className = 'btn-accion btn-eliminar';
        btnCancelado.textContent = 'Cancelar';
        btnCancelado.disabled = p.estado === 'cancelado';
        btnCancelado.onclick = function () {
            actualizarEstado(id, 'cancelado', p);
        };

        acciones.appendChild(btnEntregado);
        acciones.appendChild(btnCancelado);

        pedido.appendChild(info);
        pedido.appendChild(estado);
        pedido.appendChild(acciones);

        return pedido;
    }

    function actualizarEstado(id, nuevoEstado, pedido, despuesDeGuardar) {
        const estadoAnterior = pedido ? pedido.estado : null;
        updateDoc(doc(db, 'pedidos', id), {
            estado: nuevoEstado,
            actualizado: serverTimestamp()
        }).then(function () {
            cargarPedidos();
            if (nuevoEstado === 'entregado' && estadoAnterior !== 'entregado') {
                enviarAvisoPedido(Object.assign({ id: id }, pedido), 'entregado').then(function (resultado) {
                    if (!resultado.ok && resultado.error !== 'EmailJS sin configurar') {
                        alert('El pedido se marcó como entregado, pero no se pudo enviar el correo: ' + resultado.error);
                    }
                });
            }
            if (despuesDeGuardar) despuesDeGuardar();
        }).catch(function (error) {
            alert('Error al actualizar el pedido: ' + error.message);
        });
    }

    // ── Detalle completo del pedido ──
    let mapaProductos = null;
    let pedidoActual = null;

    function cargarProductosParaImagenes() {
        if (mapaProductos) return Promise.resolve(mapaProductos);
        return getDocs(query(collection(db, 'productos')))
            .then(function (snapshot) {
                mapaProductos = {};
                snapshot.forEach(function (docSnap) {
                    mapaProductos[docSnap.id] = docSnap.data();
                });
                return mapaProductos;
            })
            .catch(function () {
                return {};
            });
    }

    function construirItems(p) {
        return (Array.isArray(p.items) && p.items.length > 0)
            ? p.items
            : [{
                productoId: p.productoId,
                productoNombre: p.productoNombre,
                productoPrecio: p.productoPrecio,
                cantidad: p.cantidad || 1
            }];
    }

    function calcularTotal(p, items) {
        return Number.isFinite(Number(p.total))
            ? Number(p.total)
            : items.reduce(function (t, i) { return t + Number(i.productoPrecio) * Number(i.cantidad); }, 0);
    }

    function abrirDetalle(id, p) {
        document.getElementById('modalDetalle').style.display = 'flex';
        const contenedor = document.getElementById('contenidoDetalle');
        contenedor.innerHTML = '';
        pedidoActual = Object.assign({ id: id }, p);

        const items = construirItems(p);
        const total = calcularTotal(p, items);

        const cabecera = document.createElement('div');
        cabecera.className = 'detalle-pedido-cabecera';

        const titulo = document.createElement('h2');
        titulo.className = 'detalle-pedido-titulo';
        titulo.textContent = 'Pedido ' + id;

        const estado = document.createElement('span');
        estado.className = 'pedido-estado estado-' + (p.estado || 'pendiente');
        estado.textContent = etiquetaEstado(p.estado);

        cabecera.appendChild(titulo);
        cabecera.appendChild(estado);

        const meta = document.createElement('div');
        meta.className = 'detalle-pedido-meta';

        const cliente = document.createElement('div');
        cliente.textContent = 'Cliente: ' + (p.usuarioEmail || 'Cliente');

        const fecha = document.createElement('div');
        fecha.textContent = 'Fecha: ' + formatearFecha(p.fecha);

        const actualizado = document.createElement('div');
        actualizado.textContent = p.actualizado ? 'Actualizado: ' + formatearFecha(p.actualizado) : '';

        meta.appendChild(cliente);
        meta.appendChild(fecha);
        if (p.actualizado) meta.appendChild(actualizado);

        const subtitulo = document.createElement('div');
        subtitulo.className = 'detalle-pedido-subtitulo';
        subtitulo.textContent = 'Cartas del pedido';

        const lista = document.createElement('div');
        lista.className = 'detalle-pedido-lista';

        items.forEach(function (item) {
            const linea = document.createElement('div');
            linea.className = 'detalle-linea';

            const imagen = document.createElement('div');
            imagen.className = 'detalle-linea-imagen';
            const producto = (mapaProductos || {})[item.productoId] || {};
            const src = producto.imagen || item.imagen;
            if (src) {
                const img = document.createElement('img');
                img.src = src;
                img.alt = item.productoNombre || 'Carta';
                img.loading = 'lazy';
                imagen.appendChild(img);
            } else {
                const span = document.createElement('span');
                span.textContent = 'MTG';
                imagen.appendChild(span);
            }

            const info = document.createElement('div');
            info.className = 'detalle-linea-info';

            const nombre = document.createElement('div');
            nombre.className = 'detalle-linea-nombre';
            nombre.textContent = item.productoNombre + '  x' + item.cantidad;

            const sub = document.createElement('div');
            sub.className = 'detalle-linea-sub';
            sub.textContent = formatearPrecio(Number(item.productoPrecio)) + ' c/u = ' + formatearPrecio(Number(item.productoPrecio) * Number(item.cantidad));

            info.appendChild(nombre);
            info.appendChild(sub);

            linea.appendChild(imagen);
            linea.appendChild(info);

            lista.appendChild(linea);
        });

        const totalDiv = document.createElement('div');
        totalDiv.className = 'detalle-pedido-total';
        totalDiv.textContent = 'Total: ' + formatearPrecio(total);

        contenedor.appendChild(cabecera);
        contenedor.appendChild(meta);
        contenedor.appendChild(subtitulo);
        contenedor.appendChild(lista);
        contenedor.appendChild(totalDiv);

        const btnEntregado = document.getElementById('btnEntregadoModal');
        const btnCancelado = document.getElementById('btnCanceladoModal');
        document.getElementById('accionesDetalle').style.display = 'flex';
        btnEntregado.disabled = p.estado === 'entregado';
        btnCancelado.disabled = p.estado === 'cancelado';
    }

    function cerrarDetalle() {
        document.getElementById('modalDetalle').style.display = 'none';
        pedidoActual = null;
    }

    document.getElementById('cerrarDetalle').addEventListener('click', cerrarDetalle);

    document.getElementById('modalDetalle').addEventListener('click', function (e) {
        if (e.target === this) cerrarDetalle();
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') cerrarDetalle();
    });

    document.getElementById('btnEntregadoModal').addEventListener('click', function () {
        if (pedidoActual) actualizarEstado(pedidoActual.id, 'entregado', pedidoActual, cerrarDetalle);
    });

    document.getElementById('btnCanceladoModal').addEventListener('click', function () {
        if (pedidoActual) actualizarEstado(pedidoActual.id, 'cancelado', pedidoActual, cerrarDetalle);
    });
</script>

</body>
</html>
