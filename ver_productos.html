<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Productos</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<div class="card card-lista">
    <h1>Ver Productos</h1>
    <h2>Lista de productos registrados</h2>
    <p>Aqui se muestran todos los productos (cartas de MTG) del sistema.</p>

    <div class="filtros">
        <input type="search" id="busqueda" class="campo-busqueda" placeholder="Buscar por nombre o descripcion...">
        <div class="filtros-opciones">
            <select id="orden" class="campo-select">
                <option value="recientes">Mas recientes</option>
                <option value="nombre-asc">Nombre (A-Z)</option>
                <option value="nombre-desc">Nombre (Z-A)</option>
                <option value="precio-asc">Precio (menor a mayor)</option>
                <option value="precio-desc">Precio (mayor a menor)</option>
            </select>
            <label class="solo-stock">
                <input type="checkbox" id="soloStock"> Solo en stock
            </label>
        </div>
    </div>

    <div id="contador" class="contador"></div>

    <div id="listaProductos" class="productos"></div>

    <p id="vacio" class="mensaje">No hay productos registrados todavia.</p>
    <p id="sinResultados" class="mensaje" style="display:none;">No hay productos que coincidan con el filtro.</p>

    <a href="index.html" class="btn btn-volver">Volver al inicio</a>
</div>

<div id="modal" class="modal-overlay">
    <div class="modal-contenido">
        <button type="button" id="cerrarModal" class="btn-cerrar" title="Cerrar">&times;</button>
        <div id="detalleModal" class="detalle"></div>
        <div class="modal-acciones">
            <button type="button" id="btnPedirModal" class="btn-accion btn-pedir btn-grande">Agregar al carrito</button>
            <button type="button" id="btnModificarModal" class="btn-accion btn-editar btn-grande">Modificar</button>
            <button type="button" id="btnEliminarModal" class="btn-accion btn-eliminar btn-grande">Eliminar</button>
        </div>
    </div>
</div>

<button type="button" id="btnCarritoFlotante" class="carrito-flotante">Ver carrito (0)</button>

<div id="modalCarrito" class="modal-overlay">
    <div class="modal-contenido">
        <button type="button" id="cerrarCarrito" class="btn-cerrar" title="Cerrar">&times;</button>
        <h2 style="margin:0 0 10px;">Tu carrito</h2>
        <div id="listaCarrito"></div>
        <p id="carritoVacio" class="mensaje">El carrito está vacío. Agregá cartas para pedirlas.</p>
        <div id="resumenCarrito" style="display:none;">
            <div class="carrito-total" id="totalCarrito"></div>
            <div class="modal-acciones">
                <button type="button" id="btnDescargarPDF" class="btn-accion btn-pedir btn-grande">Descargar PDF</button>
                <button type="button" id="btnFinalizarPedido" class="btn-accion btn-editar btn-grande">Finalizar pedido</button>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { productosRef, collection, getDocs, query, orderBy, deleteDoc, doc, auth, onAuthStateChanged, db, serverTimestamp, runTransaction, obtenerEsAdmin } from './firebaseConfig.js';

    let productosDisponibles = [];
    let esAdmin = false;

    onAuthStateChanged(auth, function (user) {
        const autenticado = user && !user.isAnonymous;
        esAdmin = false;
        if (autenticado) {
            obtenerEsAdmin().then(function (admin) {
                esAdmin = admin;
            });
        }
    });

    window.addEventListener('DOMContentLoaded', function () {
        cargarProductos();

        const busqueda = document.getElementById('busqueda');
        const orden = document.getElementById('orden');
        const soloStock = document.getElementById('soloStock');

        busqueda.addEventListener('input', render);
        orden.addEventListener('change', render);
        soloStock.addEventListener('change', render);
    });

    function cargarProductos() {
        const consulta = query(productosRef, orderBy('createdAt', 'desc'));
        getDocs(consulta)
            .then(function (snapshot) {
                const productos = [];
                snapshot.forEach(function (doc) {
                    productos.push({ id: doc.id, ...doc.data() });
                });
                productosDisponibles = productos;
                render();
            })
            .catch(function () {
                document.getElementById('vacio').textContent = 'No se pudo conectar con Firebase.';
                document.getElementById('vacio').style.display = 'block';
            });
    }

    function formatearPrecio(precio) {
        const numero = Number(precio);
        if (!Number.isFinite(numero)) return '$' + precio;
        return numero.toLocaleString('es-AR', { style: 'currency', currency: 'ARS', minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }

    function badgeStock(producto) {
        const badge = document.createElement('div');
        const stock = Number(producto.stock);
        if (Number.isFinite(stock) && stock > 0) {
            badge.className = 'stock-badge stock-en';
            badge.textContent = 'En stock: ' + stock;
        } else {
            badge.className = 'stock-badge stock-agotado';
            badge.textContent = 'Sin stock';
        }
        return badge;
    }

    function aplicarFiltros(lista) {
        const termino = document.getElementById('busqueda').value.trim().toLowerCase();
        const soloStock = document.getElementById('soloStock').checked;
        const orden = document.getElementById('orden').value;

        let resultado = lista.filter(function (p) {
            const coincideTexto = !termino || (p.nombre || '').toLowerCase().includes(termino) || (p.descripcion || '').toLowerCase().includes(termino);
            const coincideStock = !soloStock || Number(p.stock) > 0;
            return coincideTexto && coincideStock;
        });

        switch (orden) {
            case 'nombre-asc':
                resultado.sort(function (a, b) { return String(a.nombre).localeCompare(String(b.nombre)); });
                break;
            case 'nombre-desc':
                resultado.sort(function (a, b) { return String(b.nombre).localeCompare(String(a.nombre)); });
                break;
            case 'precio-asc':
                resultado.sort(function (a, b) { return Number(a.precio) - Number(b.precio); });
                break;
            case 'precio-desc':
                resultado.sort(function (a, b) { return Number(b.precio) - Number(a.precio); });
                break;
            default:
                resultado.sort(function (a, b) {
                    const fa = a.createdAt ? a.createdAt.toMillis() : 0;
                    const fb = b.createdAt ? b.createdAt.toMillis() : 0;
                    return fb - fa;
                });
        }

        return resultado;
    }

    function render() {
        const contenedor = document.getElementById('listaProductos');
        const vacio = document.getElementById('vacio');
        const sinResultados = document.getElementById('sinResultados');
        const contador = document.getElementById('contador');

        const filtrados = aplicarFiltros(productosDisponibles);

        contenedor.innerHTML = '';
        contador.textContent = productosDisponibles.length
            ? 'Mostrando ' + filtrados.length + ' de ' + productosDisponibles.length + ' productos'
            : '';

        vacio.style.display = productosDisponibles.length === 0 ? 'block' : 'none';
        sinResultados.style.display = (productosDisponibles.length > 0 && filtrados.length === 0) ? 'block' : 'none';

        filtrados.forEach(function (p) {
            contenedor.appendChild(crearCarta(p));
        });
    }

    function crearCarta(p) {
        const carta = document.createElement('div');
        carta.className = 'carta';
        carta.setAttribute('role', 'button');
        carta.tabIndex = 0;

        const tipo = document.createElement('div');
        tipo.className = 'carta-tipo';
        tipo.textContent = 'Cartas de MTG';

        const nombre = document.createElement('div');
        nombre.className = 'carta-nombre';
        nombre.textContent = p.nombre;

        const imagen = document.createElement('div');
        imagen.className = 'carta-imagen';
        if (p.imagen) {
            const img = document.createElement('img');
            img.src = p.imagen;
            img.alt = p.nombre;
            imagen.appendChild(img);
        } else {
            imagen.textContent = 'MTG';
        }

        const descripcion = document.createElement('div');
        descripcion.className = 'carta-descripcion';
        descripcion.textContent = p.descripcion;

        const stock = badgeStock(p);

        const precio = document.createElement('div');
        precio.className = 'carta-precio';
        precio.textContent = formatearPrecio(p.precio);

        const botonAgregar = document.createElement('button');
        botonAgregar.type = 'button';
        botonAgregar.className = 'btn-accion btn-agregar btn-grande';
        botonAgregar.textContent = 'Agregar al carrito';
        botonAgregar.onclick = function (e) {
            e.stopPropagation();
            agregarAlCarrito(p);
        };

        carta.appendChild(tipo);
        carta.appendChild(nombre);
        carta.appendChild(imagen);
        carta.appendChild(descripcion);
        carta.appendChild(stock);
        carta.appendChild(precio);
        carta.appendChild(botonAgregar);

        carta.addEventListener('click', function () {
            abrirModal(p);
        });
        carta.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                abrirModal(p);
            }
        });

        return carta;
    }

    function abrirModal(producto) {
        const contenedor = document.getElementById('detalleModal');
        contenedor.innerHTML = ''; 

        const ficha = document.createElement('div');
        ficha.className = 'ficha';

        const imagen = document.createElement('div');
        imagen.className = 'ficha-imagen';
        if (producto.imagen) {
            const img = document.createElement('img');
            img.src = producto.imagen;
            img.alt = producto.nombre;
            imagen.appendChild(img);
        } else {
            imagen.textContent = 'MTG';
        }

        const info = document.createElement('div');
        info.className = 'ficha-info';

        const tipo = document.createElement('div');
        tipo.className = 'ficha-tipo';
        tipo.textContent = 'Cartas de MTG';

        const nombre = document.createElement('div');
        nombre.className = 'ficha-nombre';
        nombre.textContent = producto.nombre;

        const descripcion = document.createElement('div');
        descripcion.className = 'ficha-descripcion';
        descripcion.textContent = producto.descripcion;

        const stockEtiqueta = document.createElement('div');
        stockEtiqueta.className = 'ficha-etiqueta';
        stockEtiqueta.textContent = 'Stock';

        const stock = document.createElement('div');
        stock.className = 'ficha-stock';
        const stockNum = Number(producto.stock);
        stock.textContent = (Number.isFinite(stockNum) && stockNum > 0) ? 'Disponibles: ' + stockNum : 'Sin stock';
        stock.classList.add(Number.isFinite(stockNum) && stockNum > 0 ? 'ficha-stock-en' : 'ficha-stock-agotado');

        const precioEtiqueta = document.createElement('div');
        precioEtiqueta.className = 'ficha-etiqueta';
        precioEtiqueta.textContent = 'Precio';

        const precio = document.createElement('div');
        precio.className = 'ficha-precio';
        precio.textContent = formatearPrecio(producto.precio);

        info.appendChild(tipo);
        info.appendChild(nombre);
        info.appendChild(descripcion);
        info.appendChild(stockEtiqueta);
        info.appendChild(stock);
        info.appendChild(precioEtiqueta);
        info.appendChild(precio);

        ficha.appendChild(imagen);
        ficha.appendChild(info);

        contenedor.appendChild(ficha);

        const btnPedir = document.getElementById('btnPedirModal');
        btnPedir.style.display = '';
        btnPedir.onclick = function () {
            agregarAlCarrito(producto);
        };

        const btnModificar = document.getElementById('btnModificarModal');
        const btnEliminar = document.getElementById('btnEliminarModal');

        btnModificar.style.display = esAdmin ? '' : 'none';
        btnEliminar.style.display = esAdmin ? '' : 'none';

        btnModificar.onclick = function () {
            location.href = 'editar_producto.html?id=' + producto.id;
        };

        btnEliminar.onclick = async function () {
            if (confirm('¿Estás seguro de que quieres eliminar "' + producto.nombre + '"?')) {
                try {
                    await deleteDoc(doc(productosRef, producto.id));
                    cerrarModal();
                    cargarProductos();
                } catch (error) {
                    alert('Error al eliminar: ' + error.message);
                }
            }
        };

        document.getElementById('modal').style.display = 'flex';
    }

    // ── Carrito (guardado en localStorage) ──
    const CLAVE_CARRITO = 'carrito';

    function obtenerCarrito() {
        try {
            const guardado = JSON.parse(localStorage.getItem(CLAVE_CARRITO) || '[]');
            return Array.isArray(guardado) ? guardado : [];
        } catch (error) {
            return [];
        }
    }

    function guardarCarrito(items) {
        localStorage.setItem(CLAVE_CARRITO, JSON.stringify(items));
        actualizarContadorCarrito();
    }

    function agregarAlCarrito(producto) {
        const carrito = obtenerCarrito();
        const existente = carrito.find(function (item) { return item.id === producto.id; });
        if (existente) {
            existente.cantidad += 1;
        } else {
            carrito.push({
                id: producto.id,
                nombre: producto.nombre,
                precio: Number(producto.precio),
                imagen: producto.imagen || '',
                cantidad: 1
            });
        }
        guardarCarrito(carrito);
        alert('"' + producto.nombre + '" se agregó al carrito.');
    }

    function cambiarCantidad(id, delta) {
        const carrito = obtenerCarrito();
        const item = carrito.find(function (i) { return i.id === id; });
        if (!item) return;
        item.cantidad += delta;
        if (item.cantidad < 1) item.cantidad = 1;
        guardarCarrito(carrito);
        renderCarrito();
    }

    function quitarDelCarrito(id) {
        guardarCarrito(obtenerCarrito().filter(function (item) { return item.id !== id; }));
        renderCarrito();
    }

    function totalCarrito() {
        return obtenerCarrito().reduce(function (total, item) {
            return total + Number(item.precio) * Number(item.cantidad);
        }, 0);
    }

    function cantidadTotal() {
        return obtenerCarrito().reduce(function (total, item) {
            return total + Number(item.cantidad);
        }, 0);
    }

    function actualizarContadorCarrito() {
        document.getElementById('btnCarritoFlotante').textContent = 'Ver carrito (' + cantidadTotal() + ')';
    }

    function renderCarrito() {
        const carrito = obtenerCarrito();
        const lista = document.getElementById('listaCarrito');
        const vacio = document.getElementById('carritoVacio');
        const resumen = document.getElementById('resumenCarrito');

        lista.innerHTML = '';

        if (carrito.length === 0) {
            vacio.style.display = 'block';
            resumen.style.display = 'none';
            actualizarContadorCarrito();
            return;
        }

        vacio.style.display = 'none';
        resumen.style.display = 'block';
        document.getElementById('totalCarrito').textContent = 'Total: ' + formatearPrecio(totalCarrito());

        carrito.forEach(function (item) {
            const fila = document.createElement('div');
            fila.className = 'carrito-item';

            const info = document.createElement('div');
            info.className = 'carrito-item-info';

            const nombre = document.createElement('div');
            nombre.className = 'carrito-item-nombre';
            nombre.textContent = item.nombre;

            const detalle = document.createElement('div');
            detalle.className = 'carrito-item-detalle';
            detalle.textContent = formatearPrecio(item.precio) + ' c/u';

            info.appendChild(nombre);
            info.appendChild(detalle);

            const acciones = document.createElement('div');
            acciones.className = 'carrito-item-acciones';

            const btnMenos = document.createElement('button');
            btnMenos.type = 'button';
            btnMenos.className = 'carrito-boton-cant';
            btnMenos.textContent = '-';
            btnMenos.onclick = function () { cambiarCantidad(item.id, -1); };

            const cantidad = document.createElement('span');
            cantidad.textContent = item.cantidad;

            const btnMas = document.createElement('button');
            btnMas.type = 'button';
            btnMas.className = 'carrito-boton-cant';
            btnMas.textContent = '+';
            btnMas.onclick = function () { cambiarCantidad(item.id, 1); };

            const subtotal = document.createElement('span');
            subtotal.className = 'carrito-item-detalle';
            subtotal.textContent = '= ' + formatearPrecio(Number(item.precio) * Number(item.cantidad));

            const quitar = document.createElement('button');
            quitar.type = 'button';
            quitar.className = 'carrito-quitar';
            quitar.textContent = 'Quitar';
            quitar.onclick = function () { quitarDelCarrito(item.id); };

            acciones.appendChild(btnMenos);
            acciones.appendChild(cantidad);
            acciones.appendChild(btnMas);
            acciones.appendChild(subtotal);
            acciones.appendChild(quitar);

            fila.appendChild(info);
            fila.appendChild(acciones);

            lista.appendChild(fila);
        });

        actualizarContadorCarrito();
    }

    // ── PDF ──
    function cargarImagenParaPDF(src) {
        return new Promise(function (resolver) {
            if (!src) {
                return resolver('');
            }
            if (String(src).indexOf('data:') === 0) {
                return resolver(String(src));
            }
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = function () {
                const canvas = document.createElement('canvas');
                canvas.width = img.width;
                canvas.height = img.height;
                canvas.getContext('2d').drawImage(img, 0, 0);
                resolver(canvas.toDataURL('image/jpeg', 0.7));
            };
            img.onerror = function () {
                resolver('');
            };
            img.src = src;
        });
    }

    function formatoImagen(dataUrl) {
        if (/^data:image\/png/i.test(dataUrl)) return 'PNG';
        if (/^data:image\/webp/i.test(dataUrl)) return 'WEBP';
        return 'JPEG';
    }

    async function generarPDF(items, clienteEmail, idPedido) {
        const doc = new window.jspdf.jsPDF();

        doc.setFontSize(18);
        doc.text('Cartón Pintado', 14, 20);
        doc.setFontSize(11);
        doc.text('Pedido de cartas' + (idPedido ? ' (ID ' + idPedido + ')' : ''), 14, 28);
        doc.text('Cliente: ' + (clienteEmail || '-'), 14, 35);
        doc.text('Fecha: ' + new Date().toLocaleString('es-AR'), 14, 42);

        let y = 52;
        doc.setFontSize(10);
        doc.setFont('helvetica', 'bold');
        doc.text('Carta', 32, y);
        doc.text('Cant.', 150, y);
        doc.text('Precio', 165, y);
        doc.setFont('helvetica', 'normal');
        y += 8;

        for (let i = 0; i < items.length; i++) {
            const item = items[i];

            if (y > 265) {
                doc.addPage();
                y = 20;
            }

            const dataUrl = await cargarImagenParaPDF(item.imagen);
            if (dataUrl) {
                doc.addImage(dataUrl, formatoImagen(dataUrl), 14, y - 15, 12, 17);
            }

            doc.text(String(item.nombre).slice(0, 45), 32, y);
            doc.text(String(item.cantidad), 150, y);
            doc.text(formatearPrecio(Number(item.precio)), 165, y);
            if (dataUrl) {
                doc.setFontSize(8);
                doc.text(String(item.nombre).slice(45, 90), 32, y + 4);
                doc.setFontSize(10);
            }

            y += 20;
        }

        y += 4;
        doc.setFont('helvetica', 'bold');
        doc.text('TOTAL: ' + formatearPrecio(items.reduce(function (t, i) {
            return t + Number(i.precio) * Number(i.cantidad);
        }, 0)), 14, y);

        doc.save('pedido_carton_pintado.pdf');
    }

    // ── Finalizar pedido ──
    async function finalizarPedido() {
        const carrito = obtenerCarrito();
        if (carrito.length === 0) {
            alert('El carrito está vacío.');
            return;
        }

        const user = auth.currentUser;
        if (!user) {
            location.href = 'login.html?destino=' + encodeURIComponent(window.location.pathname);
            return;
        }

        const btnFinalizar = document.getElementById('btnFinalizarPedido');
        btnFinalizar.disabled = true;
        btnFinalizar.textContent = 'Procesando...';

        try {
            const pedidoRef = doc(collection(db, 'pedidos'));
            let items = [];

            await runTransaction(db, async function (tx) {
                items = [];

                for (const item of carrito) {
                    const prodRef = doc(productosRef, item.id);
                    const prodSnap = await tx.get(prodRef);

                    if (!prodSnap.exists()) {
                        throw new Error('La carta "' + item.nombre + '" ya no está disponible.');
                    }

                    const stock = Number(prodSnap.data().stock) || 0;
                    const cantidad = Number(item.cantidad);

                    if (stock < cantidad) {
                        throw new Error('Stock insuficiente de "' + item.nombre + '". Quedan ' + stock + ' disponibles.');
                    }

                    await tx.update(prodRef, { stock: stock - cantidad });

                    items.push({
                        productoId: item.id,
                        productoNombre: item.nombre,
                        productoPrecio: Number(item.precio),
                        cantidad: cantidad
                    });
                }

                const total = items.reduce(function (t, i) { return t + Number(i.productoPrecio) * Number(i.cantidad); }, 0);

                await tx.set(pedidoRef, {
                    items: items,
                    total: total,
                    usuarioId: user.uid,
                    usuarioEmail: user.email,
                    estado: 'pendiente',
                    fecha: serverTimestamp()
                });
            });

            guardarCarrito([]);
            renderCarrito();
            cerrarCarrito();
            cargarProductos();
            generarPDF(items, user.email, pedidoRef.id);
            alert('Pedido registrado. Se descontó el stock y se descargó el PDF.');
        } catch (error) {
            alert('Error al registrar el pedido: ' + error.message);
        } finally {
            btnFinalizar.disabled = false;
            btnFinalizar.textContent = 'Finalizar pedido';
        }
    }

    function abrirCarrito() {
        renderCarrito();
        document.getElementById('modalCarrito').style.display = 'flex';
    }

    function cerrarCarrito() {
        document.getElementById('modalCarrito').style.display = 'none';
    }

    document.getElementById('btnCarritoFlotante').addEventListener('click', abrirCarrito);
    document.getElementById('cerrarCarrito').addEventListener('click', cerrarCarrito);
    document.getElementById('btnFinalizarPedido').addEventListener('click', finalizarPedido);
    document.getElementById('btnDescargarPDF').addEventListener('click', function () {
        const carrito = obtenerCarrito();
        if (carrito.length === 0) return;
        generarPDF(carrito, null, null);
    });

    document.getElementById('modalCarrito').addEventListener('click', function (e) {
        if (e.target === this) {
            cerrarCarrito();
        }
    });

    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
            cerrarCarrito();
            cerrarModal();
        }
    });

    function cerrarModal() {
        document.getElementById('modal').style.display = 'none';
    }

    document.getElementById('cerrarModal').addEventListener('click', cerrarModal);

    document.getElementById('modal').addEventListener('click', function (e) {
        if (e.target === this) {
            cerrarModal();
        }
    });

</script>

</body>
</html>
