<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartón Pintado - Tienda TCG</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="card">
    <img src="Imagenes/bluecardlogofinal-colorcorregido8131.png" alt="Logo Cartón Pintado" class="logo-principal">
    <h1>Cartón Pintado</h1>
    <h2>Venta de naipes de MTG y distintos TCG</h2>
    <p>
        Tienda dedicada a la venta de cartas de Magic: The Gathering y otros juegos de cartas coleccionables.
    </p>
    <div class="botones" id="botonesInvitado">
        <a href="ver_productos.html" class="btn btn-ver">Ver Productos</a>
        <a href="login.html" class="btn btn-login">Iniciar Sesión</a>
    </div>
    <div class="botones" id="botonesAdmin" style="display: none;">
        <p id="usuarioSesion" class="usuario-sesion"></p>
        <a href="ver_productos.html" class="btn btn-ver">Ver Productos</a>
        <a href="registrar_producto.html" class="btn btn-registrar">Registrar Producto</a>
        <button type="button" id="btnCerrarSesion" class="btn btn-login">Cerrar Sesión</button>
    </div>
</div>

<script type="module">
    import { auth, onAuthStateChanged, signOut } from './firebaseConfig.js';

    const botonesInvitado = document.getElementById('botonesInvitado');
    const botonesAdmin = document.getElementById('botonesAdmin');
    const usuarioSesion = document.getElementById('usuarioSesion');

    onAuthStateChanged(auth, function (user) {
        if (user && !user.isAnonymous) {
            botonesInvitado.style.display = 'none';
            botonesAdmin.style.display = 'flex';
            usuarioSesion.textContent = 'Sesión iniciada: ' + user.email;
        } else {
            botonesInvitado.style.display = 'flex';
            botonesAdmin.style.display = 'none';
        }
    });

    document.getElementById('btnCerrarSesion').addEventListener('click', function () {
        signOut(auth).then(function () {
            location.reload();
        }).catch(function () {
            alert('Error al cerrar sesión.');
        });
    });
</script>

</body>
</html>
