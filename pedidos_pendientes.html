<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos Pendientes</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="card card-lista">
    <h1>Pedidos Pendientes</h1>
    <h2>Pedidos listos para despachar</h2>
    <p>Aqui se muestran los pedidos pendientes. Marcalos como listos para despacho cuando esten preparados.</p>

    <div id="listaPedidos" class="pedidos"></div>

    <p id="vacio" class="mensaje" style="display:none;">No hay pedidos pendientes.</p>

    <div class="pedido-acciones" style="justify-content:center; gap:12px;">
        <a href="ver_pedidos.html" class="btn btn-ver">Ver todos los pedidos</a>
        <a href="index.html" class="btn btn-volver">Volver al inicio</a>
    </div>
</div>

<script type="module">
    import { db, collection, getDocs, query, where, updateDoc, doc, serverTimestamp, obtenerEsAdmin } from './firebaseConfig.js';

    obtenerEsAdmin().then(function (admin) {
        if (!admin) {
            location.href = 'index.html';
            return;
        }
        cargarPedidos();
    });

    function formatearFecha(fecha) {
        if (!fecha) return '-';
        if (typeof fecha.toDate === 'function') {
            return fecha.toDate().toLocaleString('es-AR', { dateStyle: 'short', timeStyle: 'short' });
        }
        return String(fecha);
    }

    function formatearPrecio(precio) {
        const numero = Number(precio);
        if (!Number.isFinite(numero)) return '$' + precio;
        return numero.toLocaleString('es-AR', { style: 'currency', currency: 'ARS', minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }

    function cargarPedidos() {
        const consulta = query(collection(db, 'pedidos'), where('estado', '==', 'pendiente'));
        getDocs(consulta)
            .then(function (snapshot) {
                const contenedor = document.getElementById('listaPedidos');
                const vacio = document.getElementById('vacio');
                contenedor.innerHTML = '';

                if (snapshot.empty) {
                    vacio.style.display = 'block';
                    return;
                }

                vacio.style.display = 'none';

                const pedidos = [];
                snapshot.forEach(function (docSnap) {
                    pedidos.push({ id: docSnap.id, datos: docSnap.data() });
                });

                pedidos.sort(function (a, b) {
                    return obtenerMillis(b.datos.fecha) - obtenerMillis(a.datos.fecha);
                });

                pedidos.forEach(function (pedido) {
                    contenedor.appendChild(crearPedido(pedido.id, pedido.datos));
                });
            })
            .catch(function (error) {
                document.getElementById('vacio').textContent = 'No se pudieron cargar los pedidos: ' + error.message;
                document.getElementById('vacio').style.display = 'block';
            });
    }

    function obtenerMillis(fecha) {
        if (fecha && typeof fecha.toMillis === 'function') return fecha.toMillis();
        if (fecha && typeof fecha.toDate === 'function') return fecha.toDate().getTime();
        return 0;
    }

    function crearPedido(id, p) {
        const items = (Array.isArray(p.items) && p.items.length > 0)
            ? p.items
            : [{
                productoId: p.productoId,
                productoNombre: p.productoNombre,
                productoPrecio: p.productoPrecio,
                cantidad: p.cantidad || 1
            }];

        const total = Number.isFinite(Number(p.total))
            ? Number(p.total)
            : items.reduce(function (t, i) { return t + Number(i.productoPrecio) * Number(i.cantidad); }, 0);

        const pedido = document.createElement('div');
        pedido.className = 'pedido';

        const info = document.createElement('div');
        info.className = 'pedido-info';

        items.forEach(function (item) {
            const linea = document.createElement('div');
            linea.className = 'pedido-nombre';
            linea.textContent = item.productoNombre + '  x' + item.cantidad;

            const sub = document.createElement('div');
            sub.className = 'pedido-fecha';
            sub.textContent = formatearPrecio(Number(item.productoPrecio)) + ' c/u = ' + formatearPrecio(Number(item.productoPrecio) * Number(item.cantidad));

            info.appendChild(linea);
            info.appendChild(sub);
        });

        const cliente = document.createElement('div');
        cliente.className = 'pedido-cliente';
        cliente.textContent = p.usuarioEmail || 'Cliente';

        const fecha = document.createElement('div');
        fecha.className = 'pedido-fecha';
        fecha.textContent = formatearFecha(p.fecha);

        const precio = document.createElement('div');
        precio.className = 'pedido-precio';
        precio.textContent = 'Total: ' + formatearPrecio(total);

        info.appendChild(cliente);
        info.appendChild(fecha);
        info.appendChild(precio);

        const acciones = document.createElement('div');
        acciones.className = 'pedido-acciones';

        const btnDespacho = document.createElement('button');
        btnDespacho.type = 'button';
        btnDespacho.className = 'btn-accion btn-despacho';
        btnDespacho.textContent = 'Listo para despacho';
        btnDespacho.onclick = function () {
            marcarListoParaDespacho(id, btnDespacho);
        };

        acciones.appendChild(btnDespacho);

        pedido.appendChild(info);
        pedido.appendChild(acciones);

        return pedido;
    }

    function marcarListoParaDespacho(id, btn) {
        btn.disabled = true;
        btn.textContent = 'Procesando...';
        updateDoc(doc(db, 'pedidos', id), {
            estado: 'listo_para_despacho',
            actualizado: serverTimestamp()
        }).then(function () {
            cargarPedidos();
        }).catch(function (error) {
            btn.disabled = false;
            btn.textContent = 'Listo para despacho';
            alert('Error al actualizar el pedido: ' + error.message);
        });
    }
</script>

</body>
</html>
